// KSCSwitcher-Extended: off-world sites for KSCSwitcher's map / site list.
// A site with  body = <name>  is placed on that body by the KSCSwitcher-Extended plugin.
// Kerbangelion: the Space Center can be moved next to NERV Tabgha Base on the Moon.
@KSCSWITCHER:NEEDS[KSCSwitcher,Kerbangelion]:FINAL
{
    @LaunchSites
    {
        Site
        {
            name = mo_tabgha
            displayName = MO - NERV Tabgha
            description = The Space Center rebuilt on the Moon, 6 km from SEELE's Tabgha Base and the edge of the Tabgha Rift. Launches go straight into lunar orbit; Earth hangs overhead, red.
            body = Moon
            PQSCity
            {
                KEYname = KSC
                changeGrassColor = true
                grassColor = 0.42,0.41,0.40,0
                latitude = 30.5535
                longitude = 36.5544
                repositionRadiusOffset = 7293    // flat plateau at 7313 m (Kerbangelion Luna_VertexHeight) minus ~20 m for the KSC model
                reorientFinalAngle = -126.5544
            }
        }
    }
}
